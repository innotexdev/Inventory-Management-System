default:
  image: public.ecr.aws/docker/library/node:24-alpine
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"

stages:
  - verify

backend:
  stage: verify
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: inventory
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/inventory?schema=public"
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npm run db:deploy
    - npm run db:seed
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:write
    - npm run format
    - npm run build
    - npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

frontend:
  stage: verify
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:write
    - npm run format
    - npm run build